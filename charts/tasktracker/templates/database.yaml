# charts/tasktracker/templates/database.yaml
# DSO202 Assignment 4 - Task 1 (C4-C7): database tier, sync wave 0.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tt.fullname" . }}-db-headless
  labels: {{- include "tt.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector: {{- include "tt.selector" (dict "ctx" . "tier" "database") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tt.fullname" . }}-db
  labels: {{- include "tt.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ include "tt.fullname" . }}-db-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "tt.selector" (dict "ctx" . "tier" "database") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tt.selector" (dict "ctx" . "tier" "database") | nindent 8 }}
    spec:
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tt.fullname" . }}-config
                  key: POSTGRES_DB
          resources: {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.db.storage }}
