# charts/tasktracker/values.yaml
# DSO202 Assignment 4 - Task 1 (chart contract C1-C3, C6)
# Purpose: defaults only; each environment overrides in environments/<env>/values.yaml.
environment: dev

# C3: the chart never renders a Secret; it references one created by Sealed Secrets.
existingSecret: tasktracker-credentials

config:
  dbName: tasksdb
  dbPort: "5432"
  appPort: "8080"
  corsOrigin: "*"
  backendUrl: http://localhost:8090   # address the BROWSER uses to reach the backend

db:
  image: {repository: sarojsanyasi/dso202-db, tag: "1.0"}
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

backend:
  replicaCount: 1
  image: {repository: sarojsanyasi/dso202-backend, tag: "1.0"}
  nodePort: 30090
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}

frontend:
  replicaCount: 1
  image: {repository: sarojsanyasi/dso202-frontend, tag: "1.0"}
  nodePort: 30080
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

ingress:
  enabled: false   # C9

smokeTest:
  enabled: true
  image: busybox:1.37
  attempts: 10
