# platform/dev/rbac.yaml
# DSO202 Assignment 4 - Task 4: read-only Role for a viewer group in the dev namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasktracker-viewer
  namespace: dso202-dev
rules:
  - apiGroups: ["", "apps"]
    resources: [pods, services, deployments, statefulsets, configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasktracker-viewer
  namespace: dso202-dev
subjects:
  - {kind: Group, name: dso202-viewers, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: tasktracker-viewer, apiGroup: rbac.authorization.k8s.io}
