# argocd/applications/tasktracker-dev.yaml
# DSO202 Assignment 4 - Task 5 (Listing 14)
# Purpose: dev Task Tracker: follows main, automated sync, prune and self-heal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202
  source:
    repoURL: https://github.com/Kanishapradhan13/dso202-gitops.git
    targetRevision: main
    path: charts/tasktracker
    helm:
      releaseName: tasktracker-dev
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
