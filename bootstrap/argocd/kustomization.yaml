# bootstrap/argocd/kustomization.yaml
# DSO202 Assignment 4 - Task 2 (Listing 3): Argo CD v3.5.6 pinned by release tag, plus two local patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  - path: argocd-cm-patch.yaml
  - path: argocd-rbac-cm-patch.yaml
